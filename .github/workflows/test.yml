name: Test DBOS

on:
  push:
    branches:
      - main
      - release/*
    paths-ignore:
      - 'README.md'
  pull_request:
    branches:
      - main
      - release/*
    types:
      - ready_for_review
      - opened
      - reopened
      - synchronize
    paths-ignore:
      - 'README.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']

    services:
      # Postgres service container
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          # Specify the password for Postgres superuser.
          POSTGRES_PASSWORD: dbos
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # CockroachDB service container
      cockroachdb:
        image: cockroachdb/cockroach:latest
        ports:
          - 26257:26257
        env:
          COCKROACH_ARGS: start-single-node --insecure
        options: >-
          --health-cmd "curl -f http://localhost:8080/health?ready=1 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4.1.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4.0.2
        with:
          node-version: ${{ matrix.node-version }}
      - name: Compile and Test
        working-directory: ./
        run: |
          npm ci
          npm run build
          npm run lint
          npm run test:unit
        env:
          PGPASSWORD: dbos
          DB_PASSWORD: dbos
          DBOS_COCKROACHDB_URL: postgresql://root@localhost:26257/postgres

  # The workspace packages test independently of the SDK's own suite, so they run as their own job
  package-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: dbos
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Needed by the Kafka receiver packages. No CockroachDB: no package test uses it.
      kafka:
        image: apache/kafka
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4.1.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4.0.2
        with:
          node-version: ${{ matrix.node-version }}
      - name: Test packages
        working-directory: ./
        run: |
          npm ci
          npm run build
          npm run test:packages
        env:
          PGPASSWORD: dbos
          KAFKA_BROKER: localhost:9092

  package-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Use Node.js
        uses: actions/setup-node@v4.0.2
        with:
          node-version: '20'
      - name: Verify package publishing correctness
        run: |
          npm ci
          npm run check:package
          npm run test:publish

  # Runs the dbos-enterprise suite against this core, pairing with the same-named enterprise branch when one exists.
  enterprise:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Fork PRs get no secrets, so the app token cannot be minted there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: dbos
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      cockroachdb:
        image: cockroachdb/cockroach:latest
        ports:
          - 26257:26257
        env:
          COCKROACH_ARGS: start-single-node --insecure
        options: >-
          --health-cmd "curl -f http://localhost:8080/health?ready=1 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4.1.1
        with:
          path: dbos-transact-ts

      # The enterprise repo is private, so its checkout needs a token from the GitHub App installed on it.
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.ENTERPRISE_APP_ID }}
          private-key: ${{ secrets.ENTERPRISE_APP_PRIVATE_KEY }}
          owner: dbos-inc
          repositories: dbos-enterprise-ts

      # Same-named branch first, then the PR's base so a release branch pairs with its own release, then main.
      - name: Resolve paired enterprise ref
        id: pair
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          url="https://x-access-token:$TOKEN@github.com/dbos-inc/dbos-enterprise-ts"
          for ref in "$HEAD_REF" "$BASE_REF" main; do
            if [ -n "$ref" ] && git ls-remote --exit-code --heads "$url" "refs/heads/$ref" >/dev/null; then break; fi
          done
          echo "Testing against dbos-enterprise-ts@$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4.1.1
        with:
          repository: dbos-inc/dbos-enterprise-ts
          token: ${{ steps.app.outputs.token }}
          ref: ${{ steps.pair.outputs.ref }}
          path: dbos-enterprise-ts

      - name: Use Node.js
        uses: actions/setup-node@v4.0.2
        with:
          node-version: '20'

      # Enterprise links this checkout into its node_modules and builds it, so only the dependencies are needed here.
      - name: Install core
        run: npm ci
        working-directory: dbos-transact-ts

      - name: Build, lint, and test enterprise
        run: |
          npm ci
          npm run build
          npm run lint
          npm test
        working-directory: dbos-enterprise-ts
        env:
          PGPASSWORD: dbos
          DBOS_COCKROACHDB_URL: postgresql://root@localhost:26257/postgres
